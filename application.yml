server:
  port: 8080

spring:
  application:
    name: eventhub-backend

  datasource:
    url: jdbc:mysql://localhost:3306/eventhub_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: eventhub_user
    password: eventhub_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: eventhub-booking-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eventhub:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  seat-lock:
    timeout-minutes: 10 # Redis seat lock TTL

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
